<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Oportunidades Vivo</title>

    <style>

        }

        .card{
            max-width:900px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h1{
            color:#660099;
        }

        .campo{
            margin-top:20px;
        }

        .titulo{
            font-weight:bold;
            color:#666;
        }

        .valor{
            font-size:28px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>📱 Central de Oportunidades Vivo</h1>

    <div class="campo">
        <div class="titulo">Evento</div>
        <div class="valor">FATURA_PAGA</div>
    </div>

    <div class="campo">
        <div class="titulo">Cliente</div>
        <div class="valor">123</div>
    </div>

    <div class="campo">
        <div class="titulo">Produto Recomendado</div>
        <div class="valor">CONTA_DIGITAL</div>
    </div>

    <div class="campo">
        <div class="titulo">Motivo</div>
        <div class="valor">12 pagamentos sem atraso</div>
    </div>

</div>

</body>
</html>
